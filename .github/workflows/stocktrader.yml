# ระบบอัตโนมัติ (หุ้นไทย): อัปเดตเว็บทุกวันหลังตลาดปิด + รวบรวมข่าว + บอท Telegram แจ้งจุดซื้อ/ขาย
# เวลาใน cron เป็นเวลา UTC (ไทย = UTC+7) — GitHub อาจเริ่มช้ากว่ากำหนด 5-20 นาที
name: stocktrader

on:
  schedule:
    - cron: "*/30 3-9 * * 1-5"    # ระหว่างวัน 10:00-16:59 น.: เตือน Stop/จุดซื้อ + ข่าว
    - cron: "45 10 * * 1-5"       # สรุปหลังตลาดปิด 17:45 น. + สร้างเว็บใหม่ทั้งหมด
    - cron: "15 */3 * * *"        # นอกเวลา: รับคำสั่งบอท + อัปเดตข่าว
  workflow_dispatch:
    inputs:
      mode:
        description: "งานที่จะรัน"
        type: choice
        default: daily-set
        options: [daily-set, intraday, commands]

permissions:
  contents: write

concurrency:
  group: stocktrader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4

      - name: Load published site
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - id: mode
        run: |
          S="${{ github.event.schedule }}"
          M="${{ inputs.mode }}"
          case "$S" in
            "45 10 * * 1-5") M=daily-set ;;
            "15 */3 * * *")  M=commands ;;
            "")              ;;
            *)               M=intraday ;;
          esac
          [ -z "$M" ] && M=commands
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "mode: $M"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update stock list (Mondays)
        if: steps.mode.outputs.mode == 'daily-set' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '45'))
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python update_symbols.py || echo "update failed — keep old list"
          fi

      - name: Build website
        if: steps.mode.outputs.mode == 'daily-set'
        env:
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
        run: python build_site.py

      - name: Telegram + news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python notify.py ${{ steps.mode.outputs.mode }}

      - name: Save bot state + stock list
        run: |
          git config user.name "stocktrader-bot"
          git config user.email "stocktrader-bot@users.noreply.github.com"
          git add state/ th_stocks.json
          if ! git diff --cached --quiet; then
            git commit -m "update bot state" -q
            git pull --rebase -q && git push -q
          fi

      - name: Publish website (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f site/index.html ] || { echo "no site yet"; exit 0; }
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "stocktrader-bot"
          git config user.email "stocktrader-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "publish site $(date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
